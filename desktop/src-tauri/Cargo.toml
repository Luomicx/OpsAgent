[package]
name = "ops-agent-desktop"
version = "0.1.0"
description = "OpsAgent 桌面客户端 —— 只读运维诊断 Agent"
authors = ["Luomicx"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ops_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
which = "6"

[features]
# 把 frontendDist（../dist）的资源**嵌入**二进制，使其可独立运行。
#
# 不启用它时，程序在运行期会去连 devUrl（开发服务器），
# 因此裸 `cargo build` 的产物**不能单独运行** —— 会得到一个空白窗口。
# Tauri CLI 的 `tauri build` 会自动带上这个 feature。
#
# 想只用 cargo 做出可运行产物：
#   cargo build --release --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
