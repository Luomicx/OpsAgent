[package]
name = "ops-agent-desktop"
version = "0.1.0"
description = "OpsAgent 桌面客户端 —— 只读运维诊断 Agent"
authors = ["Luomicx"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ops_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
which = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
